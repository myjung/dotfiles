"$schema" = 'https://starship.rs/config-schema.json'

# 두 줄 프롬프트 (D2Coding Ligature 기준: Powerline 기본 심볼만 사용)
format = """
[](fg:#1a1b26)\
$username\
$hostname\
[](bg:#16213e fg:#1a1b26)\
$directory\
[](bg:#0f3460 fg:#16213e)\
$git_branch\
$git_status\
[](fg:#0f3460)\
$fill\
$python\
$nodejs\
$rust\
$golang\
$java\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true

# ─────────────────────────────── 팔레트 ───
# Tokyo Night 색상 참조
# bg     = #1a1b26  dir-bg = #16213e  git-bg = #0f3460
# blue   = #7aa2f7  cyan   = #7dcfff  green  = #9ece6a
# yellow = #e0af68  red    = #f7768e  purple = #bb9af7
# gray   = #565f89  fg     = #c0caf5

# ─────────────────────────────── 사용자/호스트 ───
[username]
style_user = "bg:#1a1b26 fg:#7aa2f7"
style_root = "bg:#f7768e fg:#1a1b26 bold"   # root: 빨간 배경 반전
format = "[ $user ]($style)"
show_always = true

[hostname]
ssh_only = false
style = "bg:#1a1b26 fg:#7dcfff"
ssh_symbol = "ssh:"
format = "[ $ssh_symbol@$hostname ]($style)"   # SSH 시: [ ssh:@hostname ]

# ─────────────────────────────── 디렉터리 ───
[directory]
style = "bg:#16213e fg:#c0caf5"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"~/Projects" = "~/P"

# ─────────────────────────────── Git ───
[git_branch]
symbol = " "   # U+E0A0 (D2Coding Ligature Powerline branch)
style = "bg:#0f3460 fg:#7aa2f7"
format = "[ $symbol$branch ]($style)"
truncation_length = 24

[git_status]
style = "bg:#0f3460"
format = '([$all_status$ahead_behind]($style) )'
ahead = "[⇡${count}](bg:#0f3460 fg:#9ece6a)"
behind = "[⇣${count}](bg:#0f3460 fg:#e0af68)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](bg:#0f3460 fg:#f7768e)"
staged = "[+${count}](bg:#0f3460 fg:#9ece6a)"
modified = "[~${count}](bg:#0f3460 fg:#e0af68)"
untracked = "[?${count}](bg:#0f3460 fg:#565f89)"
deleted = "[-${count}](bg:#0f3460 fg:#f7768e)"
stashed = "[s${count}](bg:#0f3460 fg:#bb9af7)"
conflicted = "[!!](bg:#0f3460 fg:#f7768e bold)"

# ─────────────────────────────── 언어 버전 ───
[python]
symbol = "py:"
style = "fg:#e0af68"
format = '[ $symbol${version}(\($virtualenv\)) ]($style)'

[nodejs]
symbol = "node:"
style = "fg:#9ece6a"
format = "[ $symbol$version ]($style)"
detect_files = ["package.json", ".nvmrc"]

[rust]
symbol = "rs:"
style = "fg:#f7768e"
format = "[ $symbol$version ]($style)"

[golang]
symbol = "go:"
style = "fg:#7dcfff"
format = "[ $symbol$version ]($style)"

[java]
symbol = "java:"
style = "fg:#f7768e"
format = "[ $symbol$version ]($style)"

# ─────────────────────────────── 우측 정보 ───
[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
style = "fg:#565f89"
format = "[ took $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:#565f89"
format = "[ $time ]($style)"

# ─────────────────────────────── 프롬프트 문자 ───
[character]
success_symbol = "[❯](bold fg:#9ece6a)"
error_symbol = "[❯](bold fg:#f7768e)"
vimcmd_symbol = "[❮](bold fg:#7aa2f7)"
